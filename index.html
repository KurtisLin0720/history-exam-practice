<script>
const questions=[[3,"佛教起源","佛教形成於古代印度。若從其思想核心判斷，下列哪一組概念最能說明佛教試圖回應的問題？",["四聖諦與八正道，探討苦及其解脫之道","三法印與五戒，著重維持社會倫理與來世福報","因果業報與輪迴，主張透過祭祀取得神明赦免","四姓制度與吠陀祭儀，強調依種姓履行宗教義務"],0,"四聖諦說明苦及其成因、止息與修行道路；八正道則是實踐解脫的方法。"],[3,"佛教傳播","佛教由印度向外傳播，逐漸進入中亞、東亞及東南亞。若某地佛教藝術同時呈現印度佛像特色與當地服飾、建築風格，最合理的解釋是？",["佛教傳播時保留印度原有形式，各地只在寺院建築上有所差異","地方統治者先統一宗教制度，再由中央指定藝術樣式","佛教藝術的地方差異主要來自不同時期的印度王朝更替","佛教傳播時與在地文化互動，形成不同地域特色"],3,"宗教傳播並非原樣複製，常與當地語言、藝術及信仰融合，形成地域特色。"],[3,"佛教傳播","佛教經由中亞商路傳入中國，沿途商旅、僧侶及翻譯者都可能參與。這最能說明哪項歷史現象？",["商路主要負責運送經典，實際傳教與翻譯通常由各地君主獨立完成","佛教傳入中國主要依靠海上航線，與中亞交通關係有限","交通與貿易網絡也能成為宗教、知識交流的管道","跨區域宗教傳播通常發生在商業交流衰退之後"],2,"絲路不只運送商品，也促進僧侶往來、經典翻譯與思想傳播。"],[3,"佛教傳播","中國佛教經典由外來語言翻譯成漢文，並逐漸出現結合中國思想的詮釋。這種發展應如何理解？",["中國思想主要改變佛教寺院的建築形式，對教義理解影響不大","外來宗教在新社會中經過翻譯、調整與在地化","佛教經典翻譯後逐漸排除原有印度思想，改以儒家經典為核心","中國佛教的形成主要由國家制定統一教義，民間詮釋較少影響"],1,"翻譯與詮釋使佛教能被不同文化理解，也促成中國佛教的在地發展。"],[3,"佛教宗派","若比較上座部佛教與大乘佛教的主要分布，哪一項概括較符合歷史發展？",["上座部佛教在東南亞較具影響，大乘佛教在東亞廣泛發展","上座部佛教主要在中國、日本發展，大乘佛教則以斯里蘭卡與泰國為中心","上座部佛教與大乘佛教的差異主要在於是否承認佛陀存在","兩者的分布差異主要形成於歐洲殖民時期，與早期傳播路線無關"],0,"上座部佛教在斯里蘭卡及東南亞部分地區發展，大乘佛教則在中國、韓國、日本等地影響深遠。"],[3,"佛教與社會","某王朝興建寺院、翻譯佛經並派遣僧侶交流。若要分析王朝支持佛教的可能影響，何者最完整？",["護持佛教主要是為了取代地方行政機構，寺院因而接管徵稅與司法","佛教僧侶的跨國交流通常會削弱王朝與鄰國的文化往來","王朝支持佛教通常只具有個人信仰意義，與政治正當性無關","有助宗教發展與文化交流，也可能提升統治者的政治聲望"],3,"統治者護持佛教可能促進寺院、教育與外交文化交流，也能強化其政治正當性。"],[3,"基督宗教起源","基督宗教起源於羅馬帝國統治下的巴勒斯坦地區，早期信徒逐漸向帝國各地傳播。哪項因素有助於理解其傳播條件？",["羅馬帝國的道路便利軍隊調動，但基督徒主要依靠北歐部族遷徙傳教","基督宗教先在西歐形成，再隨羅馬軍隊傳入巴勒斯坦","羅馬帝國的道路、城市與交通網絡提供往來條件","基督宗教早期傳播主要依賴十字軍與封建騎士的遠征"],2,"帝國道路、城市與共同語言環境等條件，便利早期基督徒跨地區傳教。"],[3,"基督宗教與羅馬","羅馬帝國早期曾迫害基督徒，後來卻逐漸承認並支持基督宗教。這項轉變最適合說明？",["羅馬皇帝由迫害轉為支持，主要是因基督宗教已先成為帝國唯一合法宗教","宗教與國家權力的關係會隨政治情勢改變","帝國政策的轉變主要反映基督教會放棄一神信仰","基督徒獲得合法地位後，教會便不再需要與世俗政權合作"],1,"從迫害到合法化、再到取得重要地位，顯示國家政策與宗教關係會變動。"],[3,"基督宗教與羅馬","四世紀羅馬皇帝頒布敕令，使基督宗教取得合法地位。若將此事件與後來基督宗教成為帝國重要宗教連結，最合理的推論是？",["皇帝政策改變，為教會公開發展創造更有利條件","敕令的主要作用是將基督宗教定為帝國唯一官方語言，促進行政統一","皇帝承認基督宗教，表示帝國已完成東西分治","基督宗教成為重要宗教，主要是因為羅馬帝國停止使用城市道路"],0,"合法化降低了信仰活動受到官方壓制的限制，後續皇帝支持又進一步提升教會地位。"],[3,"基督宗教組織","中古西歐修道院保存典籍、抄寫文獻並提供教育。若政治局勢動盪，修道院仍能維持一定文化活動，這反映何者？",["修道院的文化活動主要依賴世俗大學，與教會組織沒有直接關係","修道院保存典籍的目的，是將古典知識限制在貴族家庭內","修道院能維持文化活動，表示西歐各地已由教會建立統一政府","宗教組織在政治分裂時仍可能扮演文化延續的角色"],3,"修道院除宗教功能外，也在典籍保存、教育及文化傳承上發揮作用。"],[3,"基督宗教發展","東西教會逐漸形成不同傳統，與語言、文化、政治中心及教會權威等因素有關。這說明宗教分歧通常如何形成？",["東西教會的分歧主要起因於十字軍攻陷君士坦丁堡後才開始","東西教會差異主要是對是否接受佛教經典有不同意見","長期累積的多種差異可能逐步造成分裂","教會分裂是因為西歐各王國先完成政治統一，才要求宗教獨立"],2,"東西教會分裂不是單一事件突然造成，而是長期政治、文化與教會權威差異累積的結果。"],[3,"伊斯蘭教起源","伊斯蘭教興起於阿拉伯半島。若要解釋其早期發展與阿拉伯社會的關係，何者最合理？",["伊斯蘭教的共同體主要依靠原有部落血緣維持，信仰並未改變社會關係","共同信仰有助於跨部落建立更緊密的共同體","伊斯蘭教的興起使阿拉伯商業活動轉向以農業自給為主","伊斯蘭教初期主要以波斯帝國的行政制度作為宗教組織"],1,"伊斯蘭信仰與共同體的建立，改變阿拉伯半島部分社會與政治關係。"],[3,"伊斯蘭教發展","穆罕默德由麥加遷往麥地那的事件，後來成為伊斯蘭曆紀元起點。這項事件的重要性在於？",["穆斯林共同體的建立與發展出現重要轉折","希吉拉代表穆罕默德由麥地那返回麥加，並重新採用多神信仰","希吉拉是穆罕默德出生之年，後來才被選為伊斯蘭曆起點","希吉拉象徵阿拉伯半島已被拜占庭帝國正式併吞"],0,"622年的希吉拉是伊斯蘭共同體發展的重要里程碑，也是伊斯蘭曆的起點。"],[3,"伊斯蘭教信仰","若史料提到穆斯林每日禮拜、齋戒月齋戒及前往麥加朝覲，最可能是在描述哪一宗教的實踐？",["每日禮拜、齋戒月齋戒與朝覲是三種宗教共同遵守的固定儀式","朝覲是佛教徒前往印度菩提伽耶的修行活動","齋戒月是基督宗教紀念耶穌復活的節期","伊斯蘭教"],3,"禮拜、齋戒與朝覲等實踐是伊斯蘭教重要宗教義務。"],[3,"伊斯蘭文明","阿拉伯學者翻譯、整理希臘典籍，也吸收印度數學知識。若將此現象放在世界史脈絡中，何者最合理？",["伊斯蘭學者主要保存希臘典籍，卻排斥印度數學及其他外來成果","伊斯蘭世界的學術成果主要來自歐洲文藝復興後的反向輸入","伊斯蘭文明是跨區域知識保存、交流與再發展的重要媒介","希臘典籍在伊斯蘭世界的流傳，與後來歐洲學術發展沒有關聯"],2,"伊斯蘭世界透過翻譯、研究與傳播，保存並發展多地知識成果。"],[3,"伊斯蘭文明","伊比利半島部分地區曾受伊斯蘭政權統治，留下建築、農業與學術交流的痕跡。這最能支持哪個結論？",["伊斯蘭政權統治期間，當地其他宗教群體通常不再參與城市生活","不同宗教文化接觸可能產生長期的文化交流與融合","伊比利半島的文化交流主要發生於近代殖民時期，與中古統治無關","建築與農業技術的變化只能證明人口遷入，不能反映知識交流"],1,"伊比利半島是文化接觸地帶，影響不只限於政治統治，也包含知識、技術與藝術。"],[3,"宗教比較","比較佛教、基督宗教與伊斯蘭教的起源地，下列何者正確？",["佛教起源於印度，基督宗教起源於巴勒斯坦一帶，伊斯蘭教起源於阿拉伯半島","佛教起源於恆河流域，基督宗教起源於阿拉伯半島，伊斯蘭教起源於羅馬","佛教起源於中國，基督宗教起源於埃及，伊斯蘭教起源於印度","三者都起源於地中海東岸，後來才分別傳入亞洲"],0,"三大普世宗教各有不同起源地，之後透過不同路徑向外傳播。"],[3,"宗教與交流","某商業城市同時出現佛教寺院、基督宗教教堂與伊斯蘭商人社群。最適合的歷史解釋是？",["多元宗教社群通常由統治者先指定共同教義，再允許商人使用不同儀式","商業城市出現多種宗教，主要表示各社群之間沒有經濟往來","宗教接觸通常需要先發生大規模戰爭，日常貿易並非重要因素","商業往來與人口移動促成宗教接觸及多元社群形成"],3,"貿易、移民與旅行都可能帶來宗教傳播，城市因而形成多元社群。"],[3,"歷史解釋","若以「普世宗教」作為單元主題，最適合用哪項共同特徵理解佛教、基督宗教與伊斯蘭教？",["普世宗教是指由單一帝國制定、只在其疆域內實行的官方祭祀","普世宗教的共同點是都以同一部經典及相同儀式為核心","具有超越單一地方族群的傳播能力，並在多地形成信仰社群","普世宗教主要依靠族群血緣傳承，不鼓勵向外傳播"],2,"普世宗教能跨越原生地區與族群傳播，但各宗教教義與實踐仍有差異。"],[4,"文藝復興背景","十五世紀義大利部分城市因商業與金融活動累積財富，富商及統治者資助藝術家。這項條件最可能 次環球航行」，最精確的回答應是？",["首次環球航行實際由達伽馬率領，麥哲倫只負責繪製航線","船隊在麥哲倫死亡後即終止航行，環球航行由後人重新完成","麥哲倫本人完成返航，船員只負責前半段航程","麥哲倫所率領的船隊，由倖存船員完成全程"],3,"麥哲倫是遠征的領導者，但途中身亡，船隊由其他船員完成環球航行。"],[4,"大航海時代","歐洲海外航行逐漸使大西洋沿岸港口興起，部分地中海港口相對失去原有優勢。此現象最適合稱為？",["大西洋港口興起主要因地中海貿易擴張，與新航路開闢關係有限","貿易重心轉移表示歐洲與亞洲的商品往來逐漸停止","歐洲貿易重心逐步向大西洋沿岸轉移","地中海港口失去優勢主要是因為奧斯曼帝國禁止所有海上貿易"],2,"新航路與跨洋貿易擴大，使大西洋沿岸國家與港口的重要性上升。"],[4,"哥倫布大交換","美洲原產的玉米、馬鈴薯傳入歐亞非洲；馬匹、牛隻及部分疾病則由舊大陸傳入美洲。這種跨洋生物交流稱為？",["哥倫布大交換只指美洲金銀輸入歐洲，不包含動植物及疾病","哥倫布大交換","哥倫布大交換是歐洲各國之間交換航海地圖的制度","哥倫布大交換主要發生於亞洲與非洲，與美洲無關"],1,"哥倫布大交換涵蓋作物、動物、人口與疾病在新舊大陸間的跨洋移動。"],[4,"哥倫布大交換","馬鈴薯傳入歐洲後，逐漸成為部分地區的重要糧食。若從全球史角度分析，這說明大航海時代的影響不只在政治，也涉及？",["生態、飲食與人口經濟結構的改變","馬鈴薯傳播主要改變歐洲宗教制度，與飲食及農業無關","美洲作物進入歐洲後，歐洲農業立即改為單一作物種植","作物跨洲傳播不會影響人口成長或地區飲食習慣"],0,"作物傳播會改變飲食與農業結構，並可能影響人口及經濟發展。"],[4,"美洲殖民","歐洲殖民者征服美洲後，原住民人口大量減少。若要解釋這一結果，哪一組因素較完整？",["原住民人口下降主要是因殖民政府提供醫療與土地後自願遷徙","疾病傳播是唯一因素，戰爭及勞動制度不會影響人口變化","人口減少主要發生在歐洲移民抵達以前，與殖民接觸無關","戰爭、強迫勞動、疾病傳播及社會結構破壞"],3,"征服、疾病、勞動剝削與原有社會秩序遭破壞等因素共同造成嚴重衝擊。"],[4,"美洲殖民","西班牙殖民者在美洲建立殖民統治，並開採貴金屬、徵用勞動力。這種殖民經濟最可能使殖民地呈現何種特徵？",["殖民經濟通常以提高原住民自給能力為優先，出口資源只是附帶結果","殖民地的礦產與勞動力主要由當地居民自行決定如何分配","經濟活動常配合宗主國利益，資源與勞動力被大量輸出","殖民統治後，殖民地通常立即取得與宗主國相同的貿易權利"],2,"殖民地常被納入宗主國主導的經濟體系，資源與勞動力服務於殖民利益。"],[4,"美洲殖民","歐洲殖民者在美洲發展甘蔗等種植園，並大量使用非洲奴隸勞動。這與哪一種跨區域經濟網絡密切相關？",["種植園勞動主要由歐洲自由移民自願承擔，與非洲人口移動無關","跨大西洋奴隸貿易及大西洋三角貿易","大西洋三角貿易主要連結歐洲、東亞與澳洲","奴隸貿易主要發生在地中海內部，與美洲種植園需求無關"],1,"種植園商品、奴隸輸送與歐洲製成品貿易形成跨大西洋經濟網絡。"],[4,"美洲殖民","若一個殖民地主要生產單一出口作物，食品與工業用品卻依賴外部輸入，這種經濟結構最可能造成什麼風險？",["容易受國際價格波動影響，且經濟發展受宗主國需求牽制","單一出口作物能使殖民地免於國際市場變化，並提升糧食自主性","依賴外部輸入通常會使殖民地不再受宗主國政策影響","單一作物經濟會自然促成產業多元化，降低出口風險"],0,"單一出口型經濟容易受價格與外部需求變化衝擊，也可能強化依附關係。"],[4,"美洲原住民","某地殖民前已有城市、農業與政治組織，殖民後原有統治體系遭征服。由此可知哪項說法錯誤？",["殖民前美洲已有城市與政治組織，但多數制度是由歐洲移民建立","原住民社會雖有農業，卻沒有任何政治組織或區域交流","殖民征服主要改變美洲的宗教名稱，原有權力結構大致不變","美洲在歐洲人抵達前並不存在文明社會"],3,"美洲原住民在歐洲人到來前已建立多樣社會與文明，不能視為沒有歷史。"],[4,"澳洲殖民","英國將澳洲作為殖民地，早期曾把部分地區用作流放罪犯的場所。這項政策最能反映殖民擴張的哪種面向？",["澳洲最初主要作為英國與印度之間的自由貿易港，流放制度並不重要","英國流放罪犯至澳洲，是為了讓澳洲立即取得自治地位","殖民地也可能被宗主國用於人口安置與帝國治理","流放政策顯示英國並未打算在澳洲建立長期殖民據點"],2,"澳洲早期英國殖民與流放制度相關，也逐漸擴張為定居殖民。"],[4,"澳洲原住民","英國 q[3].forEach((s,i)=>{const b=document.createElement("button");b.className="option";const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);const body=document.createElement("span");body.textContent=s;b.append(letter,body);b.onclick=()=>{if(locked)return;choice=i;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("submit").disabled=false;};$("options").appendChild(b);});

function submit(){if(choice===null||locked)return;locked=true;const q=list[idx],ok=choice===q[4];done++;if(ok)score++;const opts=[...document.querySelectorAll(".option")];opts.forEach((b,i)=>{b.disabled=true;if(i===q[4])b.classList.add("correct");if(i===choice&&!ok)b.classList.add("wrong");});$("feedback").className="feedback "+(ok?"good":"bad");const title=document.createElement("strong");title.textContent=ok?"答對了！":"答錯了，正確答案是 "+String.fromCharCode(65+q[4])+"。";const p=document.createElement("p");p.textContent=q[5];$("feedback").replaceChildren(title,p);$("submit").disabled=true;$("next").disabled=false;stats();}
$("start").onclick=start;$("submit").onclick=submit;$("next").onclick=()=>{if(idx>=list.length){start();return;}idx++;render();};start();
</script></body></html>
