<script>

let list=[],idx=0,done=0,score=0,choice=null,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function stats(){$("total").textContent=list.length;$("done").textContent=done;$("score").textContent=score;$("rate").textContent=done?Math.round(score/done*100)+"%":"—";$("bar").style.width=(list.length?done/list.length*100:0)+"%";}
function start(){const c=$("chapter").value;list=questions.filter(q=>c==="all"||String(q[0])===c);if($("mode").value==="random")list=shuffle(list);idx=0;done=0;score=0;stats();render();}
function render(){choice=null;locked=false;$("feedback").className="feedback hidden";$("submit").disabled=true;$("next").disabled=true;
if(idx>=list.length){$("counter").textContent="挑戰完成";$("chapterTag").textContent="成績";$("stem").textContent="本次完成 "+done+" 題，答對 "+score+" 題，正確率 "+(done?Math.round(score/done*100):0)+"%。";$("options").innerHTML="";$("submit").disabled=true;$("next").textContent="再挑戰一次";$("next").disabled=false;stats();return;}
const q=list[idx];$("counter").textContent="第 "+(idx+1)+" / "+list.length+" 題";$("chapterTag").textContent="第"+q[0]+"章｜"+q[1];$("stem").textContent=q[2];$("options").innerHTML="";
q[3].forEach((s,i)=>{const b=document.createElement("button");b.className="option";const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);const body=document.createElement("span");body.textContent=s;b.append(letter,body);b.onclick=()=>{if(locked)return;choice=i;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("submit").disabled=false;};$("options").appendChild(b);});
$("submit").textContent="送出答案";$("next").textContent="下一題";stats();}
function submit(){if(choice===null||locked)return;locked=true;const q=list[idx],ok=choice===q[4];done++;if(ok)score++;const opts=[...document.querySelectorAll(".option")];opts.forEach((b,i)=>{b.disabled=true;if(i===q[4])b.classList.add("correct");if(i===choice&&!ok)b.classList.add("wrong");});$("feedback").className="feedback "+(ok?"good":"bad");const title=document.createElement("strong");title.textContent=ok?"答對了！":"答錯了，正確答案是 "+String.fromCharCode(65+q[4])+"。";const p=document.createElement("p");p.textContent=q[5];$("feedback").replaceChildren(title,p);$("submit").disabled=true;$("next").disabled=false;stats();}
$("start").onclick=start;$("submit").onclick=submit;$("next").onclick=()=>{if(idx>=list.length){start();return;}idx++;render();};start();
